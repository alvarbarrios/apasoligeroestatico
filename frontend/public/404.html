<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#070907" />
    <title>404 — Página no encontrada | A Paso Ligero</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #070907;
        color: #f4f5f4;
      }
      body {
        box-sizing: border-box;
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 2rem;
        place-items: center;
      }
      main {
        max-width: 38rem;
        text-align: center;
      }
      p {
        color: #a1ada1;
        line-height: 1.7;
      }
      a {
        display: inline-block;
        margin-top: 1rem;
        border: 1px solid #d4a359;
        padding: 0.8rem 1.2rem;
        color: #d4a359;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid #f4f5f4;
        outline-offset: 3px;
      }
      a:hover {
        background: #d4a359;
        color: #070907;
      }
    </style>
  </head>
  <body>
    <main>
      <p>ERROR 404 // OBJETIVO NO LOCALIZADO</p>
      <h1>Esta página no está en el archivo</h1>
      <p>La dirección puede haber cambiado o no existir. Vuelva al archivo para seguir explorando.</p>
      <a href="/">Volver a A Paso Ligero</a>
    </main>
  </body>
</html>
